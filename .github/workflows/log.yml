name: log-order-books
on:
  schedule:
    - cron: '*/10 * * * *'   # every 10 minutes (GitHub may run it a few minutes late)
  workflow_dispatch: {}       # lets you start it by hand from the Actions tab
permissions:
  contents: write
concurrency:
  group: logger
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: node logger.mjs
      - name: Save snapshot to the repo
        run: |
          git config user.name "polyscalp-bot"
          git config user.email "polyscalp-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
