name: log-order-books
# Each run stays alive ~5h40m taking a snapshot every 10 minutes, then starts the next run.
# The hourly schedule is only a backup in case the chain ever breaks (GitHub keeps at most
# one queued run, so the chain never doubles up).
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch: {}
permissions:
  contents: write
  actions: write
concurrency:
  group: logger
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - name: Snapshot every 10 minutes for ~5h40m
        run: |
          git config user.name "polyscalp-bot"
          git config user.email "polyscalp-bot@users.noreply.github.com"
          end=$((SECONDS + 20400))
          while [ $SECONDS -lt $end ]; do
            start=$SECONDS
            node logger.mjs || echo "logger run failed, continuing"
            git add data
            if ! git diff --cached --quiet; then
              git commit -q -m "snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
              for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
            fi
            wait=$((600 - (SECONDS - start)))
            [ $wait -gt 0 ] && sleep $wait
          done
      - name: Start the next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/log.yml/dispatches" \
            -d '{"ref":"main"}'
